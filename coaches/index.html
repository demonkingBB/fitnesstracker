<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coach Workspace | EliteTrack</title>
  <link rel="stylesheet" href="/styles.css"> <!-- Absolute path -->
  <link rel="stylesheet" href="/coaches/coach.css"> <!-- Absolute path -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <header>
    <nav>
      <div class="main-app-header"
        style="width: 100%; display: flex; justify-content: space-between; align-items: center;">
        <div class="header-branding">
          <h2>👑 EliteTrack Coach Workspace</h2>
          <span class="user-email-display" id="userEmail">coach@email.com</span>
        </div>

        <div class="header-actions" style="display: flex; gap: 0.75rem; align-items: center;">
          <button id="coachUpgradeBtn" class="btn-upgrade hidden"
            style="background: var(--accent-neon); color: #000000; border: none; padding: 0.5rem 1rem; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.85rem;">👑
            Upgrade Plan</button>
          <button id="logoutBtn" class="btn-logout"
            style="background: rgba(255,255,255,0.05); border: 1px solid var(--border-subtle); color: #ffffff; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-size: 0.85rem;">🚪
            Log Out</button>
        </div>
      </div>
    </nav>
  </header>

  <nav class="dashboard-tabs-nav"
    style="display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 2px solid var(--border-subtle); padding-bottom: 0.5rem; max-width: 1200px; margin-left: auto; margin-right: auto; padding-left: 2rem; padding-right: 2rem;">
    <button type="button" class="tab-nav-btn active" data-target="rosterTab"
      style="background: none; border: none; color: #ffffff; font-weight: bold; cursor: pointer; padding: 0.5rem 1rem;">👥
      Athlete Roster</button>
    <button type="button" class="tab-nav-btn" data-target="brandTab"
      style="background: none; border: none; color: var(--text-muted); font-weight: bold; cursor: pointer; padding: 0.5rem 1rem;">🎨
      Brand Settings</button>
  </nav>

  <main style="padding-top: 1rem;">
    <!-- Active Coach Trial Warning Banner (Keep this) -->
    <div id="coachExpirationBanner" class="expiration-banner hidden">...</div>

    <!-- TOP ROW: Athlete Roster (Full Width) -->
    <section class="card" style="margin-bottom: 2rem;">
      <h3 style="margin-bottom: 0.5rem;">Athlete Group</h3>
      <div id="athleteList" style="display: flex; gap: 1rem; overflow-x: auto; padding: 1rem 0;">
        <!-- Athletes will render here horizontally -->
      </div>
    </section>

    <!-- BOTTOM ROW: The 2-Column Grid -->
    <div id="activeInspector" class="hidden">
      <div class="dashboard-grid">

        <!-- LEFT COLUMN: Analytics & Biometrics -->
        <section>
          <div class="card" style="margin-bottom: 2rem;">
            <h4 style="margin-bottom: 1rem;">📈 Analytics</h4>
            <select id="coachChartSelector" class="program-select-dropdown">
              <option value="volume">Strength Volume</option>
              <option value="cardio">Cardio Output</option>
              <option value="diet">BMI & Diet</option>
            </select>
            <div style="height: 250px; margin-top: 1rem;"><canvas id="coachAnalyticsChart"></canvas></div>
          </div>

          <div id="inspectBiometricsBlock" class="card">
            <h4>Latest Snapshot</h4>
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-top: 1rem;">
              <div><strong>Weight:</strong> <span id="inspectBioWeight">-</span></div>
              <div><strong>Waist:</strong> <span id="inspectBioWaist">-</span></div>
              <div><strong>Cal:</strong> <span id="inspectBioCal">-</span></div>
            </div>
          </div>
        </section>

        <!-- RIGHT COLUMN: Audit Feed & Messages -->
        <section>
          <div class="card" style="margin-bottom: 2rem;">
            <h4 style="margin-bottom: 1rem;">Session Audit Feed</h4>
            <div id="athleteHistoryGrid" style="max-height: 400px; overflow-y: auto;"></div>
          </div>

          <div class="card">
            <h4 style="margin-bottom: 1rem;">Client Communication</h4>
            <div id="mainCommentFeed"
              style="height: 150px; overflow-y: auto; background: #000; padding: 1rem; border-radius: 4px;"></div>
            <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
              <input type="text" id="coachMessageInput" class="workout-input" placeholder="Message client...">
              <button id="sendCoachMessageBtn" class="btn-primary">Send</button>
            </div>
          </div>
        </section>

      </div>
    </div>

    <!-- TAB 2: Brand Settings customization -->
    <div id="brandTab" class="tab-content hidden" style="display: none;">
      <div style="max-width: 600px; margin: 0 auto;" class="card">
        <h3 style="margin-bottom: 0.5rem;">White-Label Settings</h3>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem;">Customized branding
          options
          apply directly to all clients on your roster instantly on login.</p>

        <!-- Inside #brandTab -->
        <form id="brandForm">
          <!-- Brand Name -->
          <div class="form-group">
            <label for="brandAppName">App Name (Workspace Title)</label>
            <input type="text" id="brandAppName" class="workout-input" placeholder="e.g. Coach Ab's Track">
          </div>

          <!-- Primary Color -->
          <div class="form-group">
            <label for="brandPrimaryColor">Theme Primary Accent Color</label>
            <input type="color" id="brandPrimaryColor" class="workout-input" style="height: 40px; cursor: pointer;">
          </div>

          <!-- Secondary Color -->
          <div class="form-group">
            <label for="brandSecondaryColor">Theme Hover Accent Color</label>
            <input type="color" id="brandSecondaryColor" class="workout-input" style="height: 40px; cursor: pointer;">
          </div>

          <!-- Background Color -->
          <div class="form-group">
            <label for="brandBgColor">Dashboard Background Color</label>
            <input type="color" id="brandBgColor" class="workout-input" style="height: 40px; cursor: pointer;">
          </div>

          <!-- Theme Mode Toggle -->
          <div class="form-group">
            <label for="brandThemeMode">Theme Mode</label>
            <select id="brandThemeMode" class="program-select-dropdown">
              <option value="dark">Dark Mode</option>
              <option value="light">Light Mode</option>
            </select>
          </div>

          <!-- Existing Contact Fields -->
          <div class="form-group">
            <label for="brandLogoUrl">Custom Logo Image URL</label>
            <input type="url" id="brandLogoUrl" class="workout-input" placeholder="https://...">
          </div>
          <div class="form-group">
            <label for="brandPhone">Public Contact Phone</label>
            <input type="tel" id="brandPhone" class="workout-input" placeholder="(555) 555-5555">
          </div>
          <div class="form-group">
            <label for="brandAddress">Public Address</label>
            <input type="text" id="brandAddress" class="workout-input" placeholder="123 Gym St">
          </div>

          <button type="submit" class="btn-primary" style="width: 100%;">Save Brand Configurations</button>
        </form>

        <div id="brandStatusMsg" class="hidden"
          style="margin-top: 1.5rem; padding: 1rem; border-radius: 6px; text-align: center;"></div>
      </div>
    </div>

  </main>

  <script src="/coaches/coach.js" type="module"></script>
</body>

</html>
